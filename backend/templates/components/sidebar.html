<!-- ============================================================
     SIDEBAR
     ============================================================ -->

<aside class="my-sidebar" id="sidebar">

    <!-- Верхняя панель с кнопками -->
    <div class="my-sidebar-header">

        <button class="my-sidebar-btn" id="sidebarPinBtn" title="Закрепить">
            <i class="bi bi-pin-angle"></i>
        </button>

        <button class="my-sidebar-btn" id="sidebarCloseBtn" title="Закрыть">
            <i class="bi bi-x-lg"></i>
        </button>

    </div>

    <!-- Навигация (заполняется через JS) -->
    <nav class="my-sidebar-nav" id="sidebarNav">
        <!-- JS заполнит -->
    </nav>

</aside>

<!-- Триггер показа (невидимая зона слева) -->
<div class="my-sidebar-trigger" id="sidebarTrigger"></div>

<!-- Оверлей (затемнение под sidebar) -->
<div class="my-sidebar-overlay" id="sidebarOverlay"></div>
