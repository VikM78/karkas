<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}КАРКАС{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- Стили проекта -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/content.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Sidebar -->
    {% include 'components/sidebar.html' %}

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Top Bar (Fixed) -->
        <div class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" id="menuToggle" title="Показать меню">
                    <i class="bi bi-list"></i>
                </button>
                <span class="top-bar-divider"></span>
                <span class="brand">
                    <span class="brand-icon">🏗️</span>
                    <span>КАРКАС</span>
                    <span class="brand-sub">| Automation System</span>
                </span>
                <span class="page-title" id="pageTitle">{% block page_title %}🏠 Дашборд{% endblock %}</span>
            </div>
            <div class="top-bar-right">
                <div style="position: relative;">
                    <button class="user-avatar-btn" id="userAvatarBtn" title="Профиль">
                        <i class="bi bi-person-circle avatar-icon"></i>
                        <span class="status-dot online" id="statusDot"></span>
                    </button>

                    <!-- Выпадающее меню -->
                    <div class="user-dropdown" id="userDropdown">
                        <div class="dropdown-user-info">
                            <div class="name" id="dropdownUserName">admin</div>
                            <div class="role" id="dropdownUserRole">Администратор</div>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" onclick="window.location.href='/app/profile'">
                            <i class="bi bi-person"></i> Профиль
                        </button>
                        <button class="dropdown-item" onclick="window.location.href='/app/settings'">
                            <i class="bi bi-gear"></i> Настройки
                        </button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item" onclick="AUTH.logout()" style="color: var(--text-danger);">
                            <i class="bi bi-box-arrow-right"></i> Выйти
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Page Content -->
        <div class="page-content">
            {% block content %}
            <div class="placeholder-page">
                <div class="icon"><i class="bi bi-tools"></i></div>
                <h3>Страница в разработке</h3>
                <p>Контент будет добавлен позже.</p>
            </div>
            {% endblock %}
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
