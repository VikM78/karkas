<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}КАРКАС{% endblock %}</title>

	<!-- Локальный Bootstrap и локальные иконки проекта без интернета -->
	<!-- <link href="https://jsdelivr.net" rel="stylesheet"> -->
	<link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.css') }}">

    <!-- Стили проекта -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/content.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Sidebar (меню) -->
    {% include 'components/sidebar.html' %}

    <!-- Зона-триггер и оверлей для сайдбара -->
    <div class="sidebar-trigger" id="sidebarTrigger"></div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Главная контентная область -->
    <div class="main-content" id="mainContent">
        
        <!-- ===== КАРТОЧКА ЗАГОЛОВКА (Командный центр по вашей структуре) ===== -->
		<div class="card-header" style="height: var(--header-height, 3.75rem); padding: 0 var(--padding-md, 1rem); display: flex; align-items: center; background: var(--bg-primary, #ffffff); border-radius: var(--card-radius, 0.5rem); border: 1px solid var(--border-color, #dee2e6); flex-shrink: 0; width: 100%;">
			<div class="top-bar" style="display: flex; justify-content: space-between; align-items: center; width: 100%; height: 100%; background: transparent; border: none; padding: 0; box-shadow: none;">
				
				<!-- ЛЕВАЯ ЧАСТЬ: Меню ➔ Разделитель ➔ Логотип ➔ Разделитель ➔ Наименование страницы -->
				<div class="top-bar-left" style="display: flex; align-items: center; gap: var(--padding-md, 1rem); flex: 1; min-width: 0;">
					<!-- 1. Кнопка меню -->
					<button class="menu-toggle" id="menuToggle" title="Показать меню" style="background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px;">
						<span class="bi bi-list" style="width: 1.5rem; height: 1.25rem;"></span>
					</button>
					
					<!-- 2. Вертикальный разделитель -->
					<span class="top-bar-divider" style="width: 1px; height: 32px; background: var(--border-color, #dee2e6); flex-shrink: 0;"></span>
					
					<!-- 3. Логотип и название проекта -->
					<span class="brand" style="display: flex; align-items: center; gap: var(--padding-xs, 0.25rem); flex-shrink: 0; font-weight: 700; color: var(--text-primary, #1a1a2e);">
						<span>🏗️ КАРКАС</span>
						<span class="brand-sub" style="font-size: var(--font-size-sm, 0.75rem); font-weight: 400; color: var(--text-secondary, #6c757d); margin-left: 4px;">| Automation System</span>
					</span>
					
					<!-- 4. Вертикальный разделитель -->
					<span class="top-bar-divider" style="width: 1px; height: 32px; background: var(--border-color, #dee2e6); flex-shrink: 0;"></span>
					
					<!-- 5. Единый контейнер TITLE (Сюда JS вставит: "Производители" и серый бадж количества строк) -->
					<div id="dynamicPageTitle" style="display: flex; align-items: center; gap: var(--padding-sm, 0.5rem); flex-shrink: 0;">
						<span class="page-title" id="pageTitle" style="font-weight: 600; font-size: var(--font-size-lg, 1rem); color: var(--text-primary, #1a1a2e);">{% block page_title %}Дашборд{% endblock %}</span>
					</div>
					
					<!-- 6. Контейнер Кнопок действий (Добавить, Редактировать). За счет margin-left: auto он прижимается вправо к аватару -->
					<div id="dynamicToolbarRight" style="display: flex; align-items: center; gap: var(--padding-sm, 0.5rem); margin-left: auto; padding-right: var(--padding-md, 1rem);"></div>
				</div>

				<!-- ПРАВАЯ ЧАСТЬ: Иконка пользователя -->
				<div class="top-bar-right" style="display: flex; align-items: center; flex-shrink: 0;">
					<button class="user-avatar-btn" id="userAvatarBtn" title="Профиль" style="background: none; border: none; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; position: relative;">
						<span class="bi bi-person-circle" style="width: 1.5rem; height: 1.5rem;"></span>
						<span class="status-dot online" id="statusDot" style="position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid #fff; background: #10b981;"></span>
					</button>
					<!-- Технические контейнеры для auth.js -->
					<div style="display: none;"><div id="dropdownUserName"></div><div id="dropdownUserRole"></div><div id="userDropdown"></div></div>
				</div>

			</div>
		</div>


        <!-- ===== КАРТОЧКА РАБОЧЕЙ ОБЛАСТИ (Контент страниц) ===== -->
        <div class="card-table">
            <div class="page-content" style="flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; padding: 0;">
                {% block content %}
                <div class="placeholder-page">
                    <div class="icon"><i class="bi bi-tools"></i></div>
                    <h3>Страница в разработке</h3>
                    <p>Контент будет добавлен позже.</p>
                </div>
                {% endblock %}
            </div>
        </div>

    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
    <script src="{{ url_for('static', filename='js/menu.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
