<!-- start_my_file backend/templates/admin/manufacturers.html -->
{% extends "admin/layout.html" %}

{% block title %}Производители{% endblock %}

{% block page_title %}
<div class="page-title-row">
    <div class="title-left">
        <span>🏷️ Производители</span>
        <span class="badge bg-secondary" id="recordCount">0 записей</span>
    </div>
    <div class="title-right">
        <button class="btn btn-primary btn-sm" id="btnAddNewRow">
            <i class="bi bi-plus-circle me-1"></i>Добавить
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="editModeToggle">
            <i class="bi bi-pencil me-1"></i>Редактировать
        </button>
    </div>
</div>
{% endblock %}

{% block content %}
<!-- Подключаем только необходимые стили, скрипты фильтров и настроек будут модульными -->
<link rel="stylesheet" href="/static/css/table.css">

<div class="table-wrap" id="manufacturersTableContainer">
    <!-- Таблица полностью рендерится через изолированный TableRenderer.js -->
</div>

<!-- Затемнение фона для модального окна -->
<div class="edit-overlay" id="editOverlay"></div>

<!-- Модальное окно редактирования/добавления записей -->
<div class="modal fade edit-modal" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalTitle">Добавить запись</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="editModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" id="editSaveBtn">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import Table from "/static/js/components/Table.js";

    document.addEventListener("DOMContentLoaded", function() {
        // Защита от утечек памяти: уничтожаем предыдущую таблицу, если она была инициализирована в SPA-сессии
        if (window._activeTable && typeof window._activeTable.destroy === "function") {
            console.log("♻️ Обнаружена старая таблица. Уничтожаем инстанс для очистки памяти...");
            window._activeTable.destroy();
        }

        // Создаем новый изолированный экземпляр таблицы для текущей страницы
        const manufacturersTable = new Table({
            containerId: "manufacturersTableContainer",
            tableKey: "manufacturers",
            pageSize: 50
        });

        // Сохраняем ссылку на активную таблицу в глобальный контекст для последующей очистки
        window._activeTable = manufacturersTable;

        // Инициализируем загрузку метаданных схемы и отрисовку данных
        manufacturersTable.init();

        // Привязываем локальное событие добавления новой строки
        const addBtn = document.getElementById("btnAddNewRow");
        if (addBtn) {
            addBtn.addEventListener("click", function() {
                alert("Функция вызова динамической формы добавления записи");
            });
        }

        // Переключение режима редактирования справочника
        const editToggleBtn = document.getElementById("editModeToggle");
        if (editToggleBtn) {
            editToggleBtn.addEventListener("click", function() {
                manufacturersTable.editMode = !manufacturersTable.editMode;
                this.classList.toggle("active", manufacturersTable.editMode);
                manufacturersTable.render();
            });
        }
    });
</script>
{% endblock %}
<!-- end_my_file backend/templates/admin/manufacturers.html -->
