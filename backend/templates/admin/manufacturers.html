{% extends "admin/layout.html" %}

{% block title %}Производители{% endblock %}

{% block page_title %}
<div class="page-title-row">
    <div class="title-left">
        <span>🏷️ Производители</span>
        <span class="badge bg-secondary" id="recordCount">0 записей</span>
    </div>
    <div class="title-right">
        <button class="btn btn-primary btn-sm" onclick="openAddModal()">
            <i class="bi bi-plus-circle me-1"></i>Добавить
        </button>
        <button class="btn btn-outline-secondary btn-sm" id="editModeToggle" onclick="toggleEditMode()">
            <i class="bi bi-pencil me-1"></i>Редактировать
        </button>
        <button class="btn btn-outline-secondary btn-sm btn-columns" id="btnColumns" onclick="openColumnSettings()" style="display:none;">
            <i class="bi bi-layout-three-columns me-1"></i>Столбцы
        </button>
    </div>
</div>
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/table.css') }}">
<script src="{{ url_for('static', filename='js/table-config.js') }}"></script>
<script src="{{ url_for('static', filename='js/table-filters.js') }}"></script>
<script src="{{ url_for('static', filename='js/table.js') }}"></script>
<script src="{{ url_for('static', filename='js/TableRenderer.js') }}"></script>

<div class="table-page">
    <div class="table-wrap" id="manufacturersTableContainer">
        <!-- Рендерится через TableRenderer -->
    </div>
</div>

<!-- Затемнение -->
<div class="edit-overlay" id="editOverlay"></div>

<!-- Модальное окно редактирования -->
<div class="modal fade edit-modal" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalTitle">Добавить запись</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="editModalBody"></div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-primary" id="editSaveBtn">Сохранить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно настройки столбцов -->
<div class="modal fade column-settings-modal" id="columnSettingsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Настройка столбцов</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="columnSettingsBody"></div>
            <div class="modal-footer">
                <button class="btn btn-outline-secondary" onclick="resetColumnSettings()">Сбросить</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    //  ИНИЦИАЛИЗАЦИЯ ЧЕРЕЗ TableRenderer
    // ============================================================

    let tableState = null;
    let editMode = false;

    function loadManufacturersData(page, search, filter, callback) {
        const statusFilter = filter || 'all';
        let url = `/api/v1/tables/manufacturers/data?page=${page}&per_page=50&status=${statusFilter}`;
        if (search) url += `&search=${encodeURIComponent(search)}`;
        
        if (tableState && tableState.columnSort && tableState.columnSort.key) {
            url += `&sort=${tableState.columnSort.key}&order=${tableState.columnSort.direction || 'asc'}`;
        }

        if (tableState && tableState.columnFilters) {
            Object.keys(tableState.columnFilters).forEach(key => {
                const values = tableState.columnFilters[key];
                if (values && values.length > 0) {
                    url += `&filter_${key}=${encodeURIComponent(values.join(','))}`;
                }
            });
        }

        fetch(url, { credentials: 'include' })
            .then(response => {
                if (!response.ok) throw new Error('Ошибка загрузки');
                return response.json();
            })
            .then(data => {
                callback(data.data || []);
                if (typeof updateRecordCount === 'function') {
                    updateRecordCount(data.total || data.data?.length || 0);
                }
            })
            .catch(error => {
                console.error('Ошибка загрузки:', error);
                callback([]);
                if (typeof updateRecordCount === 'function') {
                    updateRecordCount(0);
                }
            });
    }

    function openAddModal() {
        if (!tableState) {
            alert('Таблица не загружена');
            return;
        }
        window.openEditModal(tableState, null);
    }

    function editManufacturer(id) {
        fetch(`/api/v1/tables/manufacturers/${id}`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                console.log('📝 Данные для редактирования:', data);
                if (!tableState) {
                    alert('Таблица не загружена');
                    return;
                }
                window.openEditModal(tableState, data);
            })
            .catch(() => alert('Ошибка загрузки данных'));
    }

    function deleteManufacturer(id) {
        if (!confirm('Пометить производителя на удаление?')) return;
        fetch(`/api/v1/tables/manufacturers/${id}`, { method: 'DELETE', credentials: 'include' })
            .then(response => {
                if (response.ok) { alert('✅ Производитель удалён'); loadData(tableState, 1); }
                else { alert('❌ Ошибка при удалении'); }
            });
    }

    function restoreManufacturer(id) {
        if (!confirm('Восстановить производителя?')) return;
        fetch(`/api/v1/tables/manufacturers/${id}/restore`, { method: 'POST', credentials: 'include' })
            .then(response => {
                if (response.ok) { alert('✅ Производитель восстановлен'); loadData(tableState, 1); }
                else { alert('❌ Ошибка при восстановлении'); }
            });
    }

    function hardDeleteManufacturer(id) {
        if (!confirm('Удалить производителя навсегда? Это действие необратимо!')) return;
        fetch(`/api/v1/tables/manufacturers/${id}/hard`, { method: 'DELETE', credentials: 'include' })
            .then(response => {
                if (response.ok) { alert('✅ Производитель удалён навсегда'); loadData(tableState, 1); }
                else { alert('❌ Ошибка при удалении'); }
            });
    }

    window.editItem = editManufacturer;
    window.deleteItem = deleteManufacturer;
    window.restoreItem = restoreManufacturer;
    window.hardDeleteItem = hardDeleteManufacturer;

    // Выделение строки для мультиредактирования
    document.addEventListener('click', function(e) {
        const row = e.target.closest('tr[data-id]');
        if (!row || !tableState) return;
        const rowId = parseInt(row.dataset.id);
        const ctrlKey = e.ctrlKey || e.metaKey;
        const shiftKey = e.shiftKey;
        selectRow(tableState, rowId, ctrlKey, shiftKey);
    });

    document.addEventListener('DOMContentLoaded', function() {
        const renderer = new TableRenderer('manufacturersTableContainer');
        
        loadTableSchema('manufacturers').then((schema) => {
            if (!schema) {
                console.error('❌ Схема не загружена');
                return;
            }
            
            console.log('✅ Схема загружена:', schema);
            
            const settings = loadTableSettings('manufacturers');
            tableState = {
                tableKey: 'manufacturers',
                settings: settings,
                config: schema,
                currentPage: 1,
                currentFilter: 'all',
                currentSearch: '',
                columnFilters: {},
                columnSort: { key: null, direction: null },
                editMode: false,
                rowHeights: settings.rowHeights || {},
                _lastData: [],
                selectedRows: new Set(),
                container: document.getElementById('manufacturersTableContainer'),
                table: null,
                colgroup: null,
                thead: null,
                tbody: null,
            };
            
            window._tableState = tableState;
            
            loadManufacturersData(1, '', 'all', function(data) {
                tableState._lastData = data || [];
                renderer.schema = schema;
                renderer.settings = settings;
                renderer.data = data || [];
                renderer.tableKey = 'manufacturers';
                renderer.render();
                updateRecordCount(data?.length || 0);
                
                // Сохраняем ссылки на элементы
                const container = document.getElementById('manufacturersTableContainer');
                tableState.table = container.querySelector('table');
                tableState.colgroup = container.querySelector('colgroup');
                tableState.thead = container.querySelector('thead');
                tableState.tbody = container.querySelector('tbody');
            });
        });

        document.getElementById('editSaveBtn').addEventListener('click', () => {
            if (!tableState) {
                alert('Таблица не загружена');
                return;
            }
            window.saveEditForm(tableState);
        });

        document.getElementById('editModal').addEventListener('hidden.bs.modal', function() {
            const editOverlay = document.getElementById('editOverlay');
            if (editOverlay) { editOverlay.classList.remove('active'); editOverlay.style.zIndex = '1040'; }
        });
    });
</script>
{% endblock %}
