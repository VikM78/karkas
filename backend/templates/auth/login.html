<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — КАРКАС</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            max-width: 400px;
            width: 100%;
        }
        .login-card .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-card .logo h2 {
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }
        .login-card .logo small {
            color: #888;
            font-size: 13px;
        }
        .login-card .logo .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 8px;
        }
        .login-card .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 2px solid #e8ecf1;
        }
        .login-card .form-control:focus {
            border-color: #4a6cf7;
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.1);
        }
        .login-card .btn-primary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: #4a6cf7;
            border: none;
            width: 100%;
        }
        .login-card .btn-primary:hover {
            background: #3b5de7;
        }
        .login-card .alert {
            border-radius: 10px;
        }
        .login-card .error-message {
            color: #dc2626;
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <span class="icon">🏗️</span>
            <h2>КАРКАС</h2>
            <small>Automation Construction System</small>
        </div>

        <form id="loginForm" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Имя пользователя</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="admin" required autofocus>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">Пароль</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>
            <div id="errorMessage" class="error-message"></div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
                <i class="bi bi-box-arrow-in-right me-2"></i>Войти
            </button>
        </form>

        <hr class="my-4">
        <p class="text-center text-muted small mb-0">
            <i class="bi bi-shield-lock me-1"></i>
            Тестовый доступ: admin / admin123
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Вход...';
            errorEl.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = data.redirect || '/';
                } else {
                    errorEl.textContent = data.error || 'Ошибка входа';
                    errorEl.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Войти';
                }
            } catch (error) {
                errorEl.textContent = 'Ошибка соединения с сервером';
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Войти';
            }
        });
    </script>
</body>
</html>
<!-- end_my_file backend/templates/auth/login.html -->
